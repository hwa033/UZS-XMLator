version: '3.8'

services:
  web:
    build: .
    container_name: uzs_xmlator_web
    env_file: .env
    environment:
      - FLASK_ENV=production
    volumes:
      # Persist generated output (all types)
      - ./uzs_filedrop/UZI-GAP3/UZSx_ACC1/v0428:/app/uzs_filedrop/UZI-GAP3/UZSx_ACC1/v0428
      - ./uzs_filedrop/UZI-GAP3/UZSx_ACC1/UwvZwMelding_MQ_V0428:/app/uzs_filedrop/UZI-GAP3/UZSx_ACC1/UwvZwMelding_MQ_V0428
      - ./build/excel_generated:/app/build/excel_generated
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: uzs_xmlator_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Single default site config
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certs directory (fullchain.pem, key.pem)
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: unless-stopped
