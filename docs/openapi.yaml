openapi: 3.0.3
info:
  title: XMLator API
  version: 1.0.0
  description: Endpoints for health, readiness, metrics, and XML generation (UI-backed uploads).
servers:
  - url: http://localhost:5000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
  /ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Service ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
  /api/xml/throughput:
    get:
      summary: Throughput metrics
      responses:
        '200':
          description: Counts of generated XML files
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  last24h:
                    type: integer
  /api/xml/latest-errors:
    get:
      summary: Latest generation errors
      responses:
        '200':
          description: Array of recent errors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    aanvraag_type:
                      type: string
                    omgeving:
                      type: string
                    stderr:
                      type: string
                    filename:
                      type: string
                    tijdstip:
                      type: string
                      format: date-time
  /upload_excel:
    post:
      summary: Upload Excel to generate XML (UI form)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                excel_file:
                  type: string
                  format: binary
                validate:
                  type: string
                  enum: [on, off]
      responses:
        '200':
          description: HTML response with generation result
  /genereer_xml_json/upload_json:
    post:
      summary: Upload JSON to generate XML (UI form)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                json_file:
                  type: string
                  format: binary
                aanvraag_type:
                  type: string
                  enum: [Digipoort, OTP3, ZBM, VM]
                validate:
                  type: string
                  enum: [on, off]
      responses:
        '200':
          description: HTML response with generation result
